<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dev.to</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>

  <bodyclass="bg-light">
        <center>
  <img src="foto1.png" alt="foto1" width="60" height="50" vspace="40">
  <h2><b>Join the DEV Community</b></h2>
  <p>DEV Community is a community of 3,571,611 amazing developers</p>
</center>

        <section class="d-grid gap-2 col-5 mx-auto">

         <button class="btn btn-light d-flex align-items-center justify-content-between w-100 
               border border-1 py-3" type="button">
               <img src="fotoapple.png" alt="apple" width="20" height="20">
               <small class="mx-auto"><b>Continue with Apple</b></small>
               <span></span>
         </button>

          <button class="btn btn-light d-flex align-items-center justify-content-between w-100
               border border-1 py-3" type="button">
             <img src="fotofacebook.webp" alt="facebook" width="20" height="20">
            <small class="mx-auto"><b>Continue with Facebook</b></small>
            <span></span> 
          </button>

          <button class="btn btn-light d-flex align-items-center justify-content-between w-100
               border border-1 py-3" type="button">
             <img src="fotoforem.png" alt="forem" width="20" height="20">
            <small class="mx-auto"><b>Continue with Forem</b></small>
            <span></span> 
          </button>

          <button class="btn btn-light d-flex align-items-center justify-content-between w-100
               border border-1 py-3" type="button">
             <img src="fotogithub.png" alt="github" width="20" height="20">
            <small class="mx-auto"><b>Conrinue with GitHub</b></small>
            <span></span> 
          </button>

          <button class="btn btn-light d-flex align-items-center justify-content-between w-100
               border border-1 py-3" type="button">
             <img src="fotogoogle.png" alt="google" width="20" height="20">
            <small class="mx-auto"><b>Continue with Google</b></small>
            <span></span> 
          </button>

          <button class="btn btn-light d-flex align-items-center justify-content-between w-100
               border border-1 py-3" type="button">
             <img src="fototwitter.avif" alt="twitter" width="25" height="25">
            <small class="mx-auto"><b>Continue with Twitter (X)</b></small>
            <span></span> 
          </button>
        </section>

    <section class="container d-flex justify-content-center align-items-center">
        <section class="card p-4" style="width: 600px; border: none;">

    <section class="d-flex align-items-center my-3">
          <hr class="flex-grow-1">
          <span class="px-2 text-muted">OR</span>
          <hr class="flex-grow-1">
    </section>

            <form>
                <section class="mb-3">
                    <label class="form-label"><b>Email</b></label>
                    <input type="email" class="form-control" placeholder="">
                </section>

                <section class="mb-3">
                    <label class="form-label"><b>Password</b></label>
                    <input type="password" class="form-control" placeholder="">
                </section>

                <section class="d-flex justify-content-between align-items-center mb-3">

          <div class="form-check m-0">
                <input type="checkbox" class="form-check-input" id="remember">
                <label class="form-check-label" for="remember">Remember me</label>
          </div>

          <a href="#" class="text-decoration-none">Forgot password?</a>

          </section>


                <button type="submit" class="btn btn-primary w-100 mb-2">Log in</button>

                

                <section class="text-center">
                   <small class="text-muted">
                    <em>
                        By signing in, you agree to our 
                        <a href="#">privacy policy</a>, 
                        <a href="#">terms of use</a> 
                        and 
                        <a href="#">code of conduct</a>.
                        <hr class="my-3">
                    </em>
                    </small>
                    <p class="mb-1">New to DEV Community? <a href="#">Create account.</a></p>
                </section>

            </form>

        </section>
    </section>

    

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
